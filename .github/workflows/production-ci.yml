name: Production CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "KCPM-*"
    paths:
      - "backend/**"
      - "frontend/**"
      - "postman/**"
      - ".github/workflows/**"
      - ".github/scripts/**"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "frontend/**"
      - "postman/**"
      - ".github/workflows/**"
      - ".github/scripts/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_API_BASE_URL: https://health-management-backend-d1gk.onrender.com
  DEFAULT_E2E_TEST_URL: https://ktpm-ruby.vercel.app/
  TEST_ADMIN_EMAIL: admin@care.com
  TEST_ADMIN_PASSWORD: admin123
  TEST_MANAGER_EMAIL: manager@care.com
  TEST_MANAGER_PASSWORD: admin123
  TEST_DOCTOR_EMAIL: mai.le@care.com
  TEST_DOCTOR_PASSWORD: admin123
  TEST_PATIENT_EMAIL: truongquocan@patient.com
  TEST_PATIENT_PASSWORD: admin123
  TEST_CLINIC_ID: "1"

jobs:
  backend-test:
    name: Backend - Maven Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw clean verify --batch-mode --no-transfer-progress -Dspring.profiles.active=test
          else
            mvn clean verify --batch-mode --no-transfer-progress -Dspring.profiles.active=test
          fi

      - name: Summarize backend failure
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-failure-summary

          {
            echo "Backend failure summary"
            echo "======================="
            echo ""
            echo "Job: backend-test"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""

            if ls backend/target/surefire-reports/*.txt >/dev/null 2>&1; then
              echo "Surefire failure lines:"
              grep -R -n -E "FAILURE|ERROR|AssertionFailedError|expected:|but was:|Expected|Tests run:|<<< FAILURE!|<<< ERROR!" backend/target/surefire-reports/*.txt | head -n 160 || true
            else
              echo "No Surefire .txt reports found."
            fi

            echo ""

            if ls backend/target/failsafe-reports/*.txt >/dev/null 2>&1; then
              echo "Failsafe failure lines:"
              grep -R -n -E "FAILURE|ERROR|AssertionFailedError|expected:|but was:|Expected|Tests run:|<<< FAILURE!|<<< ERROR!" backend/target/failsafe-reports/*.txt | head -n 160 || true
            else
              echo "No Failsafe .txt reports found."
            fi

            echo ""
            echo "Note:"
            echo "Open backend-test artifact for full Surefire/Failsafe reports."
          } > ci-failure-summary/backend.txt

      - name: Upload backend failure summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-summary-backend-test
          path: ci-failure-summary/
          if-no-files-found: ignore

      - name: Upload backend reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
            backend/target/*.log
          if-no-files-found: warn

  frontend-test:
    name: Frontend - Build and Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run lint --if-present 2>&1 | tee ../frontend-lint.log

      - name: Run frontend typecheck
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck --if-present 2>&1 | tee ../frontend-typecheck.log

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../frontend-build.log

      - name: Summarize frontend failure
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-failure-summary

          {
            echo "Frontend failure summary"
            echo "========================"
            echo ""
            echo "Job: frontend-test"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""

            if [ -f frontend-lint.log ]; then
              echo "ESLint errors/warnings:"
              grep -n -E "error|warning|Unexpected any|no-explicit-any|no-unused-vars|react-hooks|Cannot call impure function|setState|Fast refresh" frontend-lint.log | head -n 220 || true
              echo ""
            else
              echo "No frontend-lint.log found."
              echo ""
            fi

            if [ -f frontend-typecheck.log ]; then
              echo "TypeScript errors:"
              grep -n -E "error TS|TS[0-9]+|error" frontend-typecheck.log | head -n 160 || true
              echo ""
            else
              echo "No frontend-typecheck.log found."
              echo ""
            fi

            if [ -f frontend-build.log ]; then
              echo "Build errors:"
              grep -n -E "error|failed|Error|Cannot|Module not found|Rollup|Vite|vite" frontend-build.log | head -n 160 || true
            else
              echo "No frontend-build.log found."
            fi

            echo ""
            echo "Note:"
            echo "Open frontend-test artifact for full lint/typecheck/build logs."
          } > ci-failure-summary/frontend.txt

      - name: Upload frontend failure summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-summary-frontend-test
          path: ci-failure-summary/
          if-no-files-found: ignore

      - name: Upload frontend build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-build-output
          path: |
            frontend/dist/
            frontend-lint.log
            frontend-typecheck.log
            frontend-build.log
            ~/.npm/_logs/
          if-no-files-found: warn

  postman-test:
    name: Postman - Newman API Test
    runs-on: ubuntu-latest
    needs:
      - backend-test
    timeout-minutes: 20
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection
        run: |
          COLLECTION_PATH="postman/DamDiep_Healthcare_API.postman_collection.json"
          test -f "${COLLECTION_PATH}" || (echo "Postman collection not found: ${COLLECTION_PATH}" && exit 1)

          API_BASE_URL="${API_BASE_URL:-${DEFAULT_API_BASE_URL}}"

          newman run "${COLLECTION_PATH}" \
            --env-var "baseUrl=${API_BASE_URL}" \
            --env-var "adminEmail=${TEST_ADMIN_EMAIL}" \
            --env-var "adminPassword=${TEST_ADMIN_PASSWORD}" \
            --env-var "managerEmail=${TEST_MANAGER_EMAIL}" \
            --env-var "managerPassword=${TEST_MANAGER_PASSWORD}" \
            --env-var "doctorEmail=${TEST_DOCTOR_EMAIL}" \
            --env-var "doctorPassword=${TEST_DOCTOR_PASSWORD}" \
            --env-var "patientEmail=${TEST_PATIENT_EMAIL}" \
            --env-var "patientPassword=${TEST_PATIENT_PASSWORD}" \
            --env-var "clinicId=${TEST_CLINIC_ID}" \
            --timeout-request 90000 \
            --reporters cli,json,junit \
            --reporter-json-export postman-newman-report.json \
            --reporter-junit-export postman-newman-report.xml

      - name: Summarize Postman failure
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-failure-summary

          {
            echo "Postman/Newman failure summary"
            echo "=============================="
            echo ""
            echo "Job: postman-test"
            echo "Base URL: ${API_BASE_URL:-${DEFAULT_API_BASE_URL}}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""

            if [ -f postman-newman-report.json ]; then
              echo "Newman failures:"
              node - <<'NODE'
          const fs = require("fs");

          const file = "postman-newman-report.json";
          const data = JSON.parse(fs.readFileSync(file, "utf8"));
          const failures = data.run && data.run.failures ? data.run.failures : [];

          if (!failures.length) {
            console.log("No assertion failures found in JSON report. Check runtime/network errors.");
          } else {
            for (const f of failures.slice(0, 40)) {
              const requestName = f.source && f.source.name ? f.source.name : "Unknown request";
              const errorMessage = f.error && f.error.message ? f.error.message : "Unknown error";
              const testName = f.error && f.error.test ? f.error.test : "";
              console.log(`- Request: ${requestName}`);
              if (testName) console.log(`  Test: ${testName}`);
              console.log(`  Error: ${errorMessage}`);
            }
          }
          NODE
            else
              echo "No Newman JSON report found."
            fi

            echo ""
            echo "Note:"
            echo "Open postman-newman-reports artifact for full Newman JSON/JUnit reports."
          } > ci-failure-summary/postman.txt

      - name: Upload Postman failure summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-summary-postman-test
          path: ci-failure-summary/
          if-no-files-found: ignore

      - name: Upload Postman reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postman-newman-reports
          path: |
            postman-newman-report.json
            postman-newman-report.xml
          if-no-files-found: warn

  e2e-test:
    name: E2E - CodeceptJS Playwright
    runs-on: ubuntu-latest
    needs:
      - frontend-test
    timeout-minutes: 30
    env:
      E2E_TEST_URL: https://ktpm-ruby.vercel.app/
      E2E_ADMIN_EMAIL: admin@care.com
      E2E_ADMIN_PASSWORD: admin123
      E2E_MANAGER_EMAIL: manager@care.com
      E2E_MANAGER_PASSWORD: admin123
      E2E_DOCTOR_EMAIL: mai.le@care.com
      E2E_DOCTOR_PASSWORD: admin123
      E2E_PATIENT_EMAIL: truongquocan@patient.com
      E2E_PATIENT_PASSWORD: admin123

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run CodeceptJS E2E
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          E2E_TEST_URL="${E2E_TEST_URL:-${DEFAULT_E2E_TEST_URL}}"
          HEADLESS=true TEST_URL="${E2E_TEST_URL}" npm run test:e2e 2>&1 | tee ../e2e.log

      - name: Summarize E2E failure
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-failure-summary

          {
            echo "E2E failure summary"
            echo "==================="
            echo ""
            echo "Job: e2e-test"
            echo "TEST_URL: ${E2E_TEST_URL}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""

            if [ -f e2e.log ]; then
              echo "E2E log failure lines:"
              grep -n -E "Error|Failed|FAIL|Timeout|locator|expected|Actual|Scenario|not found|Cannot" e2e.log | head -n 220 || true
            else
              echo "No e2e.log found."
            fi

            echo ""

            if [ -d frontend/output ]; then
              echo "CodeceptJS output files:"
              find frontend/output -maxdepth 2 -type f | head -n 80
            elif [ -d frontend/e2e_tests/output ]; then
              echo "CodeceptJS e2e_tests output files:"
              find frontend/e2e_tests/output -maxdepth 2 -type f | head -n 80
            else
              echo "No CodeceptJS output directory found."
            fi

            echo ""
            echo "Note:"
            echo "Open e2e-codeceptjs-reports artifact for screenshots/output files."
          } > ci-failure-summary/e2e.txt

      - name: Upload E2E failure summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-summary-e2e-test
          path: ci-failure-summary/
          if-no-files-found: ignore

      - name: Upload E2E reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-codeceptjs-reports
          path: |
            e2e.log
            frontend/output/
            frontend/tests/output/
            frontend/e2e_tests/output/
          if-no-files-found: warn

  docker-build:
    name: Docker - Backend Build
    runs-on: ubuntu-latest
    needs:
      - backend-test
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        shell: bash
        run: |
          set -o pipefail
          docker build -t kcpm-backend-ci:${{ github.sha }} ./backend 2>&1 | tee docker-build.log

      - name: Summarize Docker failure
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-failure-summary

          {
            echo "Docker build failure summary"
            echo "============================"
            echo ""
            echo "Job: docker-build"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""

            if [ -f docker-build.log ]; then
              echo "Docker build errors:"
              grep -n -E "ERROR|Error|error|failed|FAIL|Cannot|not found|no such file|denied" docker-build.log | head -n 180 || true
            else
              echo "No docker-build.log found."
            fi

            echo ""
            echo "Note:"
            echo "Open docker-build job logs for full Docker output."
          } > ci-failure-summary/docker.txt

      - name: Upload Docker failure summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-summary-docker-build
          path: ci-failure-summary/
          if-no-files-found: ignore

  create-jira-bug-on-failure:
    name: Jira - Create or Comment CI Failure
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-test
      - postman-test
      - e2e-test
      - docker-build
    if: always() && (github.ref_name == 'main' || github.ref_name == 'develop') && (needs.backend-test.result == 'failure' || needs.frontend-test.result == 'failure' || needs.postman-test.result == 'failure' || needs.e2e-test.result == 'failure' || needs.docker-build.result == 'failure')
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download CI failure summaries
        uses: actions/download-artifact@v4
        with:
          pattern: ci-failure-summary-*
          path: ci-failure-summaries
          merge-multiple: true

      - name: Create or comment Jira issue
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_MEMBER_IDS: ${{ secrets.JIRA_MEMBER_IDS }}
          JIRA_PROJECT_KEY: KCPM
          JIRA_ISSUE_TYPE: Bug
          BACKEND_RESULT: ${{ needs.backend-test.result }}
          FRONTEND_RESULT: ${{ needs.frontend-test.result }}
          POSTMAN_RESULT: ${{ needs.postman-test.result }}
          E2E_RESULT: ${{ needs.e2e-test.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          CI_FAILURE_SUMMARY_DIR: ci-failure-summaries
        run: node .github/scripts/create-or-comment-jira-ci-issue.js
